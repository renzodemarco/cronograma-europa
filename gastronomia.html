<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guía Gastronómica — Europa</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f4ef;
      --ink: #1a1714;
      --ink-muted: #6b6560;
      --ink-faint: #b0aaa4;
      --accent: #c84b2f;
      --accent-light: #f0e8e3;
      --border: #ddd8d0;
      --white: #ffffff;
      --card-bg: #fdfbf8;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
    }

    header {
      padding: 4rem 2rem 3rem;
      max-width: 860px;
      margin: 0 auto;
      border-bottom: 1px solid var(--border);
    }

    .header-label {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 1rem;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 5vw, 3.8rem);
      font-weight: 400;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 1rem;
    }

    h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .header-sub {
      font-size: 15px;
      color: var(--ink-muted);
      line-height: 1.7;
      max-width: 480px;
    }

    .route {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 1.5rem;
    }

    .route-city {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: 100px;
      color: var(--ink-muted);
      background: var(--white);
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 2rem 5rem;
    }

    .city-block {
      border-bottom: 1px solid var(--border);
    }

    .city-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.8rem 0;
      cursor: pointer;
      user-select: none;
    }

    .city-header:hover .city-title {
      color: var(--accent);
    }

    .city-flag {
      font-size: 26px;
      line-height: 1;
      flex-shrink: 0;
    }

    .city-meta {
      flex: 1;
    }

    .city-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.55rem;
      font-weight: 600;
      color: var(--ink);
      transition: color 0.2s;
    }

    .city-tagline {
      font-size: 13px;
      color: var(--ink-muted);
      margin-top: 2px;
      font-style: italic;
    }

    .toggle-icon {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-muted);
      font-size: 16px;
      transition: all 0.25s;
      flex-shrink: 0;
      background: var(--white);
    }

    .city-header.open .toggle-icon {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      transform: rotate(45deg);
    }

    .city-content {
      display: none;
      padding-bottom: 2rem;
      padding-left: 42px;
    }

    .city-content.open {
      display: block;
    }

    .section-group {
      margin-bottom: 1.6rem;
    }

    .section-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 0.9rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--accent-light);
    }

    .dishes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }

    .dish-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .dish-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 4px;
    }

    .dish-desc {
      font-size: 13px;
      color: var(--ink-muted);
      line-height: 1.55;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 12px;
      color: var(--ink-faint);
      border-top: 1px solid var(--border);
      letter-spacing: 0.05em;
    }

    .btn {
      background-color: #c84b2f;
      color: #f7f4ef;
      font-family: 'Playfair Display', serif;
      font-size: 16px;
      font-weight: 400;
      padding: 8px 18px;
      border-radius: 10px;
      text-decoration: none;
      position: fixed;
      bottom: 20px;
      border: #c84b2f 1px solid;
    }

    .btn:hover {
      background-color: #f7f4ef;
      color: #c84b2f
    }
  </style>
</head>

<body>

  <header>
    <div class="header-label">Guía gastronómica</div>
    <h1>Sabores de <em>Europa</em></h1>
    <p class="header-sub">Un recorrido por los platos que no podés perderte en cada ciudad de tu viaje.</p>
    <div class="route">
      <span class="route-city">🇮🇹 Roma</span>
      <span class="route-city">🇮🇹 Florencia</span>
      <span class="route-city">🇭🇺 Budapest</span>
      <span class="route-city">🇦🇹 Viena</span>
      <span class="route-city">🇨🇿 Praga</span>
      <span class="route-city">🇵🇱 Cracovia</span>
    </div>
  </header>

  <main id="cities"></main>

  <div style="width: 100%; padding: 26px; display: flex; flex-direction: row; justify-content: center;">
    <a href="index.html" class="btn">
      Volver
    </a>
  </div>

  <footer>Buen provecho &mdash; y buen viaje.</footer>

  <script>
    const data = [
      {
        flag: "🇮🇹", name: "Roma", tagline: "Pasta, pizza al taglio y gelato",
        sections: [
          {
            label: "Platos principales", dishes: [
              { name: "Cacio e pepe", desc: "Pasta con Pecorino Romano y pimienta negra. Simple y poderoso." },
              { name: "Carbonara", desc: "Con guanciale, yema de huevo y Pecorino. Sin crema, como manda la tradición." },
              { name: "Amatriciana", desc: "Salsa de tomate con guanciale y Pecorino. Intensa y sabrosa." },
              { name: "Saltimbocca alla romana", desc: "Ternera con jamón crudo y salvia, salteada en manteca y vino blanco." },
              { name: "Coda alla vaccinara", desc: "Rabo de buey estofado con tomate, apio y cacao. Plato popular contundente." },
            ]
          },
          {
            label: "Callejero y aperitivo", dishes: [
              { name: "Supplì", desc: "Croquetas de arroz con mozzarella filosa. El snack callejero romano por excelencia." },
              { name: "Pizza al taglio", desc: "Pizza por trozo, con masa gruesa y esponjosa. Ideal para comer caminando." },
            ]
          },
          {
            label: "Postres", dishes: [
              { name: "Tiramisú", desc: "Clásico con mascarpone, café y cacao. Omnipresente en los menús romanos." },
              { name: "Gelato artesanal", desc: "Buscá las heladerías artesanales, no las que tienen montañas de colores." },
            ]
          },
        ]
      },
      {
        flag: "🇮🇹", name: "Florencia", tagline: "Bistecca, ribollita y Chianti",
        sections: [
          {
            label: "Platos principales", dishes: [
              { name: "Bistecca alla Fiorentina", desc: "Chuletón de ternera chianina a la parrilla. Se pide por kilo. El rey de la cocina toscana." },
              { name: "Ribollita", desc: "Sopa densa de pan, alubias y verduras. Reconfortante y campesina." },
              { name: "Pappardelle al cinghiale", desc: "Pasta ancha con ragú de jabalí. Sabor intenso, muy típico de Toscana." },
              { name: "Lampredotto", desc: "Callos de ternera en panino con salsa verde. El sándwich callejero florentino." },
            ]
          },
          {
            label: "Para beber y picar", dishes: [
              { name: "Chianti Classico", desc: "Vino tinto de la región, ideal para acompañar cualquier carne." },
              { name: "Crostini con fegatini", desc: "Pan tostado con paté de hígado de pollo. Aperitivo típico toscano." },
            ]
          },
          {
            label: "Postres", dishes: [
              { name: "Cantucci con Vin Santo", desc: "Galletitas de almendra duras para mojar en el vino dulce. Ritual toscano." },
              { name: "Schiacciata alla fiorentina", desc: "Torta esponjosa con naranja, típica del carnaval pero presente todo el año." },
            ]
          },
        ]
      },
      {
        flag: "🇭🇺", name: "Budapest", tagline: "Gulyás, paprika y Tokaj",
        sections: [
          {
            label: "Platos principales", dishes: [
              { name: "Gulyás", desc: "Estofado de res con paprika, cebolla y papas. Suele servirse como sopa espesa." },
              { name: "Pörkölt", desc: "Versión más densa del gulásh, casi guiso. A veces de cerdo o pollo." },
              { name: "Töltött káposzta", desc: "Hojas de repollo rellenas con carne y arroz, en salsa de tomate y crema agria." },
              { name: "Lángos", desc: "Pan frito callejero con crema agria y queso rallado. Absolutamente adictivo." },
            ]
          },
          {
            label: "Postres", dishes: [
              { name: "Kürtőskalács", desc: "Pastel enrollado en palo, tostado y cubierto de azúcar y canela." },
              { name: "Somlói galuska", desc: "Trifle húngaro: bizcochuelo, crema, chocolate y nueces." },
              { name: "Dobos torta", desc: "Torta de capas con crema de chocolate y caramelo crujiente. Ícono húngaro." },
            ]
          },
          {
            label: "Para beber", dishes: [
              { name: "Tokaji", desc: "Vino dulce de la región de Tokaj. Uno de los más famosos del mundo." },
              { name: "Pálinka", desc: "Aguardiente de frutas, muy fuerte. Se toma como digestivo." },
            ]
          },
        ]
      },
      {
        flag: "🇦🇹", name: "Viena", tagline: "Schnitzel, café y strudel",
        sections: [
          {
            label: "Platos principales", dishes: [
              { name: "Wiener Schnitzel", desc: "Ternera finísima empanada y frita con rodaja de limón. La milanesa vienesa." },
              { name: "Tafelspitz", desc: "Osobuco de res hervido con rábano picante y salsa de manzana. Plato imperial." },
              { name: "Zwiebelrostbraten", desc: "Lomo de res con cebolla caramelizada y salsa oscura, servido con Rösti." },
              { name: "Gulasch vienés", desc: "Más suave y oscuro que el húngaro, con mucha cebolla caramelizada." },
            ]
          },
          {
            label: "Cultura del café", dishes: [
              { name: "Melange", desc: "El café vienés por antonomasia: mitad expreso, mitad leche espumada. Se toma sin apuro." },
              { name: "Einspänner", desc: "Café negro con crema montada, servido en vaso alto." },
            ]
          },
          {
            label: "Postres", dishes: [
              { name: "Sachertorte", desc: "Torta de chocolate con mermelada de damasco. Creada en 1832. Imprescindible." },
              { name: "Apfelstrudel", desc: "Strudel de manzana con canela, pasas y masa hojaldrada. Con crema." },
              { name: "Kaiserschmarrn", desc: "Tortita esponjosa desmenuzada con azúcar y compota de ciruelas." },
            ]
          },
        ]
      },
      {
        flag: "🇨🇿", name: "Praga", tagline: "Svíčková, knedlíky y pivo",
        sections: [
          {
            label: "Platos principales", dishes: [
              { name: "Svíčková", desc: "Lomo braseado en salsa cremosa de vegetales, con knedlíky y arándanos. El plato nacional." },
              { name: "Vepřo-knedlo-zelo", desc: "Cerdo asado con repollo fermentado y bollos de pan. Clásico de pub." },
              { name: "Guláš checo", desc: "Estofado espeso de res con paprika suave, servido con knedlíky." },
              { name: "Pečená kachna", desc: "Pato asado con col y bollos. Ideal en meses fríos." },
            ]
          },
          {
            label: "Snacks y callejero", dishes: [
              { name: "Smažený sýr", desc: "Queso empanado y frito con salsa tártara. En pubs y puestos callejeros." },
              { name: "Trdelník", desc: "Pastel enrollado en palo, tostado con azúcar y canela." },
            ]
          },
          {
            label: "Sopas y postres", dishes: [
              { name: "Česnečka", desc: "Sopa de ajo contundente, a veces servida dentro de un pan de campo." },
              { name: "Medovník", desc: "Torta de miel en capas con crema. Dulce y muy típica." },
            ]
          },
        ]
      },
      {
        flag: "🇵🇱", name: "Cracovia", tagline: "Pierogi, bigos y wodka",
        sections: [
          {
            label: "Platos principales", dishes: [
              { name: "Pierogi", desc: "Ravioles polacos rellenos de papa y queso, carne o chucrut. Hervidos o fritos." },
              { name: "Bigos", desc: "Estofado de repollo fermentado con variedad de carnes y salchichas. Plato de casería." },
              { name: "Żurek", desc: "Sopa agria fermentada con huevo duro y salchicha blanca, servida en un pan." },
              { name: "Kotlet schabowy", desc: "La milanesa polaca: chuleta de cerdo empanada, con puré y repollo." },
            ]
          },
          {
            label: "Postres y dulces", dishes: [
              { name: "Obwarzanek krakowski", desc: "Rosquita de pan hervido típica de Cracovia. En carritos por toda la ciudad." },
              { name: "Sernik", desc: "Cheesecake polaco más denso que el americano, con twaróg (queso fresco)." },
              { name: "Pączki", desc: "Donuts rellenos de mermelada de rosa mosqueta y cubiertos de azúcar glaseado." },
            ]
          },
          {
            label: "Para beber", dishes: [
              { name: "Wodka", desc: "La polaca es considerada de las mejores del mundo. Se toma fría y pura." },
              { name: "Kompot", desc: "Bebida dulce de frutas cocidas. Sin alcohol, muy hogareña." },
            ]
          },
        ]
      },
    ];

    const main = document.getElementById('cities');

    data.forEach((city, i) => {
      const block = document.createElement('div');
      block.className = 'city-block';

      const hdr = document.createElement('div');
      hdr.className = 'city-header';
      hdr.innerHTML = `
    <span class="city-flag">${city.flag}</span>
    <div class="city-meta">
      <div class="city-title">${city.name}</div>
      <div class="city-tagline">${city.tagline}</div>
    </div>
    <div class="toggle-icon">+</div>
  `;

      const content = document.createElement('div');
      content.className = 'city-content';

      city.sections.forEach(sec => {
        const group = document.createElement('div');
        group.className = 'section-group';
        group.innerHTML = `<div class="section-label">${sec.label}</div>`;
        const grid = document.createElement('div');
        grid.className = 'dishes-grid';
        sec.dishes.forEach(d => {
          const card = document.createElement('div');
          card.className = 'dish-card';
          card.innerHTML = `<div class="dish-name">${d.name}</div><div class="dish-desc">${d.desc}</div>`;
          grid.appendChild(card);
        });
        group.appendChild(grid);
        content.appendChild(group);
      });

      hdr.addEventListener('click', () => {
        const isOpen = content.classList.contains('open');
        document.querySelectorAll('.city-content').forEach(el => el.classList.remove('open'));
        document.querySelectorAll('.city-header').forEach(el => el.classList.remove('open'));
        if (!isOpen) {
          content.classList.add('open');
          hdr.classList.add('open');
        }
      });

      block.appendChild(hdr);
      block.appendChild(content);
      main.appendChild(block);
    });
  </script>
</body>

</html>
